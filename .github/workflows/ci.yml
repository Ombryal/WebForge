name: CI

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure WebForge compiler
        run: cmake -S . -B build

      - name: Build WebForge compiler
        run: cmake --build build

      - name: Build tests
        run: >
          g++
          -std=c++20
          -Wall
          -Wextra
          -Isrc
          tests/compiler_tests.cpp
          src/webforge/lexer/Lexer.cpp
          src/webforge/parser/Parser.cpp
          src/webforge/codegen/CodeGen.cpp
          -o build/compiler_tests

      - name: Run tests
        run: ./build/compiler_tests
